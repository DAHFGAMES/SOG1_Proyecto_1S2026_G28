version: '3.8'

services:
  db:
    image: postgres:15
    container_name: g28_postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: G28_SOG1_2026
    volumes:
      - g28_pgdata:/var/lib/postgresql/data
    networks:
      - g28_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17.0
    container_name: g28_odoo
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: G28_SOG1_2026
    volumes:
      - g28_odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf
    networks:
      - g28_net

volumes:
  g28_pgdata:
  g28_odoo_data:

networks:
  g28_net:
    driver: bridge
