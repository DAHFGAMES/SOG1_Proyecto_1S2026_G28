services:
  db:
    image: postgres:15
    container_name: g28_postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: G28_SOG1_2026
    volumes:
      - g28_pgdata:/var/lib/postgresql/data
    networks:
      - g28_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17.0
    container_name: g28_odoo
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: G28_SOG1_2026
    volumes:
      - g28_odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf
    networks:
      - g28_net

  metabase:
    image: metabase/metabase:latest
    container_name: g28_metabase
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      # Metabase usa H2 interno por defecto. Aquí solo se conecta
      # a Odoo DB como fuente de datos (a través de la UI).
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Guatemala
    volumes:
      - g28_metabase_data:/metabase-data
    networks:
      - g28_net

volumes:
  g28_pgdata:
  g28_odoo_data:
  g28_metabase_data:

networks:
  g28_net:
    driver: bridge
